server {
    listen 3000;

    # Serve static assets directly — also rewrite internal /_next/ refs so
    # webpack runtime doesn't load chunks via absolute paths (breaks HA ingress)
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        sub_filter '/_next/' './_next/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css;
    }

    location /public/ {
        alias /app/public/;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable compression so sub_filter can work on response body
        proxy_set_header Accept-Encoding "";
        sub_filter '/_next/' './_next/';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
    }
}
